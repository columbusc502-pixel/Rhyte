    <script>
      // In AI Studio iframe preview, Vite HMR WebSockets are not forwarded through the proxy
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.error?.message?.includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && (e.reason?.message?.includes('WebSocket') || String(e.reason)?.includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
